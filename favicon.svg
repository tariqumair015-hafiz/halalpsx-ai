<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="halalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="100" height="100" rx="24" fill="#090D16" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Stylized Crescent Moon (Halal Identity) -->
  <path d="M 68 22 A 32 32 0 1 0 74 72 A 26 26 0 1 1 68 22 Z" fill="url(#halalGrad)" />

  <!-- Candlestick Bar (Bullish PSX Green) -->
  <line x1="52" y1="28" x2="52" y2="72" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
  <rect x="46" y="38" width="12" height="24" rx="3" fill="#10B981" />

  <!-- Upward Trend Star / Diamond (Prosperity) -->
  <polygon points="72,28 75,34 81,37 75,40 72,46 69,40 63,37 69,34" fill="url(#goldGrad)" />
</svg>
